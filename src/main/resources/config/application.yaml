spring:
  application:
    name: tiltak-tilsagnsbrev
  main:
    banner-mode: off
  jackson:
    locale: "no"

  kafka:
    bootstrap-servers:
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            value.default.type: no.nav.tag.tilsagnsbrev.dto.ArenaMelding

no.nav.security.jwt:
  client:
    registration:
      pdl-api:
        token-endpoint-url: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/oauth2/v2.0/token
        grant-type: client_credentials
        scope: ${PDL_API_SCOPE}
        authentication:
          client-id: ${AZURE_APP_CLIENT_ID}
          client-secret: ${AZURE_APP_CLIENT_SECRET}
          client-auth-method: client_secret_basic
      dokarkiv:
        token-endpoint-url: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/oauth2/v2.0/token
        grant-type: client_credentials
        scope: ${DOKARKIV_SCOPE}
        authentication:
          client-id: ${AZURE_APP_CLIENT_ID}
          client-secret: ${AZURE_APP_CLIENT_SECRET}
          client-auth-method: client_secret_basic


tilsagnsbrev:
  retry:
    cron:
  integrasjon:
    pdfgen:
      uri: http://tiltak-pdfgen/api/v1/genpdf
    joark:
      uri: uri
    sts:
      uri: uri
      ws-uri: ws-uri
      bruker: ${tilsagnsbrev_srvuser}
      passord: ${tilsagnsbrev_srvpwd}
    altinn:
      base-url: uri
    persondata:
      uri: uri

management.endpoints.web:
  exposure.include: prometheus
  base-path: /internal/actuator
